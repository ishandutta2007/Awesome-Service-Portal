<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    /* Animated Dynamic Circuit Lines */
    .flow-line {
      stroke-dasharray: 8 16;
      animation: dashMove 14s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }

    /* Pulse for Hub Nodes */
    .pulse-glow {
      animation: pulseAnim 3.5s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0% { opacity: 0.35; transform: scale(0.96); }
      100% { opacity: 0.85; transform: scale(1.04); }
    }

    /* Floating Pill Badges */
    .float-slow {
      animation: floatSlow 5s ease-in-out infinite alternate;
    }
    .float-delay {
      animation: floatDelay 6s ease-in-out infinite alternate;
      animation-delay: -2.5s;
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-7px); }
    }
    @keyframes floatDelay {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-9px); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />

  <!-- Ambient Ambient Glows -->
  <circle cx="200" cy="80" r="300" fill="url(#cornerGlow)" />
  <circle cx="600" cy="190" r="380" fill="url(#portalGlow)" class="pulse-glow" style="transform-origin: 600px 190px;" />

  <!-- Tech Grid / Service Connection Lines (Background) -->
  <g opacity="0.32" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <!-- Top-left network branch -->
    <path class="flow-line" d="M -50 60 L 220 60 L 310 130 L 460 130" />
    <path class="flow-line" d="M 80 -30 L 80 100 L 190 190 L 380 190" stroke="#818cf8" />
    <!-- Bottom-left network branch -->
    <path class="flow-line" d="M -20 320 L 240 320 L 340 260 L 470 260" stroke="#c084fc" />
    <!-- Top-right network branch -->
    <path class="flow-line" d="M 1250 80 L 980 80 L 890 140 L 740 140" stroke="#38bdf8" />
    <path class="flow-line" d="M 1120 -20 L 1120 110 L 1020 180 L 820 180" stroke="#818cf8" />
    <!-- Bottom-right network branch -->
    <path class="flow-line" d="M 1220 310 L 960 310 L 860 250 L 730 250" stroke="#c084fc" />
  </g>

  <!-- Dynamic Network Intersections / Activity Nodes (Background) -->
  <g>
    <!-- Left nodes -->
    <circle cx="220" cy="60" r="4" fill="#38bdf8" opacity="0.8">
      <animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="310" cy="130" r="3" fill="#818cf8" opacity="0.7" />
    <circle cx="240" cy="320" r="5" fill="#c084fc" opacity="0.9">
      <animate attributeName="r" values="3;5.5;3" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Right nodes -->
    <circle cx="980" cy="80" r="4.5" fill="#38bdf8" opacity="0.8">
      <animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="890" cy="140" r="3.5" fill="#818cf8" opacity="0.7" />
    <circle cx="960" cy="310" r="4" fill="#c084fc" opacity="0.8">
      <animate attributeName="r" values="2.5;5;2.5" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Animated Floating Pills (Flanking Sides - Outside Text Flow) -->
  <g class="float-slow">
    <!-- Left Pill 1: ITSM & ITIL -->
    <g transform="translate(70, 140)">
      <rect width="135" height="34" rx="17" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1.2" filter="url(#softShadow)" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="mono">ITSM / ITIL</text>
    </g>
    <!-- Left Pill 2: Knowledge Base -->
    <g transform="translate(85, 205)">
      <rect width="145" height="34" rx="17" fill="rgba(30, 41, 59, 0.85)" stroke="#818cf8" stroke-width="1.2" filter="url(#softShadow)" />
      <circle cx="18" cy="17" r="4" fill="#818cf8" />
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="mono">Self-Service</text>
    </g>
  </g>

  <g class="float-delay">
    <!-- Right Pill 1: Open Source -->
    <g transform="translate(995, 140)">
      <rect width="140" height="34" rx="17" fill="rgba(30, 41, 59, 0.85)" stroke="#34d399" stroke-width="1.2" filter="url(#softShadow)" />
      <circle cx="18" cy="17" r="4" fill="#34d399" />
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="mono">Open Source</text>
    </g>
    <!-- Right Pill 2: Enterprise SaaS -->
    <g transform="translate(980, 205)">
      <rect width="155" height="34" rx="17" fill="rgba(30, 41, 59, 0.85)" stroke="#c084fc" stroke-width="1.2" filter="url(#softShadow)" />
      <circle cx="18" cy="17" r="4" fill="#c084fc" />
      <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" class="mono">Enterprise SaaS</text>
    </g>
  </g>

  <!-- Central Foreground Content Card (Solid semi-transparent backing so text is never obscured) -->
  <g transform="translate(250, 45)" filter="url(#softShadow)">
    <rect width="700" height="290" rx="20" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
    <!-- Glowing Top Accent Line -->
    <rect x="0" y="0" width="700" height="3.5" rx="2" fill="url(#accentGrad)" />

    <!-- Foreground Text Elements (Crisp, High Contrast, Guaranteed Foreground) -->
    <!-- Category Badge -->
    <g transform="translate(225, 26)">
      <rect width="250" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="16" cy="14" r="4.5" fill="#38bdf8" />
      <text x="30" y="19" fill="#38bdf8" font-size="12" font-weight="700" class="mono" letter-spacing="1.2">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="350" y="112" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="800" class="sans" letter-spacing="-0.5">
      Awesome Service Portal
    </text>

    <!-- Gradient Divider Line -->
    <rect x="230" y="132" width="240" height="2" fill="url(#accentGrad)" rx="1" />

    <!-- Subtitle -->
    <text x="350" y="168" text-anchor="middle" fill="#93c5fd" font-size="18" font-weight="600" class="sans">
      Employee Self-Service, IT Help Desks &amp; Digital Workplace Portals
    </text>

    <!-- Descriptive Feature Line -->
    <text x="350" y="202" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400" class="sans">
      Enterprise SaaS Solutions • Sovereign Open-Source Stacks • ITIL Workflows
    </text>

    <!-- Bottom Feature Chips Inside Card -->
    <g transform="translate(145, 230)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="125" height="30" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="0.8" />
      <text x="62" y="19" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600" class="mono">🎯 Deflection</text>
      
      <!-- Chip 2 -->
      <rect x="140" y="0" width="130" height="30" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#818cf8" stroke-width="0.8" />
      <text x="205" y="19" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600" class="mono">⚡ Self-Service</text>
      
      <!-- Chip 3 -->
      <rect x="285" y="0" width="125" height="30" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#34d399" stroke-width="0.8" />
      <text x="347" y="19" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600" class="mono">🔒 Sovereign</text>
    </g>
  </g>
</svg>
